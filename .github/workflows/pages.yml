name: 試用版をGitHub Pagesに公開

# main に変更が入るたびに、ブラウザで試せる版を自動で更新する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 公開用（publishable）の値のみ。秘密鍵（secret / service_role）は絶対に書かない。
      EXPO_PUBLIC_SUPABASE_URL: https://nlongymtxcmkmtnkvnha.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_0iZVD-FtMS6IizPrwfK4yQ_oKPa6rl1
      EXPO_PUBLIC_APP_ENV: demo
      EXPO_PUBLIC_BASE_PATH: /kodomo-shokudo-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # 直接URLを開いたときにも画面が出るようにする（SPA用）
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
